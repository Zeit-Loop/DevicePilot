name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0+cpu"
      - run: python -m pip install --constraint constraints-docker.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q app scripts tests
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  production-containers:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ci-${{ github.sha }}
      BACKEND_ENV_FILE: ./deploy/.env.production.example
      CADDY_ENV_FILE: ./deploy/.env.production.example
      BACKUP_DIR: /tmp/devicepilot-backups
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone production Compose
        run: docker compose --profile maintenance -f compose.production.yml config --quiet
      - name: Validate Caddy configuration through Compose env_file
        run: >-
          docker compose -f compose.production.yml run --rm --no-deps
          --entrypoint caddy caddy
          validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build production images
        run: docker compose -f compose.production.yml build backend frontend
      - name: Verify proxy authentication and client identity boundary
        run: python3 -m scripts.verify_proxy_boundary
